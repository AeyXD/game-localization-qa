name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run checker test suite
        run: |
          python3 -m unittest discover -s checker -v 2>&1 | tail -5

      - name: Run eval selftest
        run: |
          python3 eval/run_eval.py selftest

      - name: Run eval trap-coverage (threshold 95%)
        run: |
          python3 eval/run_eval.py checker --min-coverage 95

      - name: Validate all data JSON files
        run: |
          python3 -c "
          import json, glob, sys
          files = sorted(glob.glob('data/*.json'))
          for f in files:
              try:
                  json.load(open(f, encoding='utf-8'))
                  print(f'  ✓ {f}')
              except json.JSONDecodeError as e:
                  print(f'  ✗ {f}: {e}')
                  sys.exit(1)
          print(f'All {len(files)} JSON files valid')
          "
